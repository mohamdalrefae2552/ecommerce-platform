# =============================================================================
# Runtime stack (docs/01 section 2). Only `edge` publishes a port.
#   app-net        edge, api, scheduler, db-app, toxiproxy, mailpit, swagger
#   inventory-net  toxiproxy, inventory, db-inventory   (internal, no egress)
# `api` is NOT on inventory-net, so it physically cannot reach db-inventory
# (R2-S2); its only way to the inventory is gRPC through toxiproxy.
#
# Profiles: (none) runtime · test (verify-*) · tools (buf, redocly, toolbox, k6)
# Development additions (mailpit UI, source mounts, Vite) live in
# compose.dev.yaml, loaded by the Makefile unless ENV=prod.
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-ecommerce-platform}

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-E-commerce Platform}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:-}
  APP_LOCALE: ${APP_LOCALE:-ar}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_STACK: ${LOG_STACK:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-db-app}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-app}
  DB_USERNAME: ${DB_USERNAME:-app}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  # Requirement 3: cache store (catalogue cache, rate limiters) in Redis.
  # Not taken from .env on purpose: older .env files still say "database".
  CACHE_STORE: redis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make bootstrap adds it)}
  CATALOG_CACHE_TTL: ${CATALOG_CACHE_TTL:-600}
  SESSION_DRIVER: ${SESSION_DRIVER:-array}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-mailpit}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@ecommerce.local}
  MAIL_FROM_NAME: ${APP_NAME:-E-commerce Platform}
  PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-16}
  JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-api}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
  JWT_LEEWAY: ${JWT_LEEWAY:-30}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
  INVENTORY_GRPC_TARGET: ${INVENTORY_GRPC_TARGET:-toxiproxy:50051}
  INVENTORY_DEADLINE_GET_MS: ${INVENTORY_DEADLINE_GET_MS:-500}
  INVENTORY_DEADLINE_RESERVE_MS: ${INVENTORY_DEADLINE_RESERVE_MS:-2000}
  INVENTORY_DEADLINE_RELEASE_MS: ${INVENTORY_DEADLINE_RELEASE_MS:-1000}
  INVENTORY_DEADLINE_ADJUST_MS: ${INVENTORY_DEADLINE_ADJUST_MS:-2000}
  INVENTORY_ORDER_BUDGET_MS: ${INVENTORY_ORDER_BUDGET_MS:-3000}
  # Dev/test accounts (D-04, D-05); ignored when APP_ENV=production.
  SEED_CUSTOMER_COUNT: ${SEED_CUSTOMER_COUNT:-60}
  SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
  DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.test}
  DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  # ------------------------------------------------------------- runtime --
  edge:
    build:
      context: infra/nginx
      additional_contexts:
        frontend: ./frontend
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - product-images:/srv/storage/products:ro
      - ./contracts/openapi/openapi.yaml:/srv/docs/openapi.yaml:ro
    depends_on:
      api:
        condition: service_healthy
      swagger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-net]

  api:
    build:
      context: backend/api
      target: runtime
    restart: unless-stopped
    environment: *api-env
    volumes:
      - product-images:/app/storage/app/public/products
      - jwt-keys:/app/storage/keys
    depends_on:
      db-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [app-net]

  scheduler:
    build:
      context: backend/api
      target: runtime
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *api-env
    volumes:
      - jwt-keys:/app/storage/keys
    depends_on:
      db-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [app-net]

  db-app:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-app-data:/var/lib/postgresql
    healthcheck: *pg-health
    networks: [app-net]

  # Requirement 3: cache only. No persistence (a restart empties it, which is
  # always safe for a cache); 128 MB with volatile-lru, so only keys that
  # have a TTL are evicted and the catalogue version key never is. No
  # published port; password from .env.
  redis:
    image: redis:8.6.8-alpine3.23
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make bootstrap adds it)}
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net]

  inventory:
    build:
      context: backend/inventory
      additional_contexts:
        contracts: ./contracts
    restart: unless-stopped
    environment:
      INVENTORY_DB_HOST: ${INVENTORY_DB_HOST:-db-inventory}
      INVENTORY_DB_PORT: ${INVENTORY_DB_PORT:-5432}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      INVENTORY_GRPC_PORT: ${INVENTORY_GRPC_PORT:-9090}
      INVENTORY_HIKARI_MAX_POOL: ${INVENTORY_HIKARI_MAX_POOL:-20}
      INVENTORY_LOCK_TIMEOUT_MS: ${INVENTORY_LOCK_TIMEOUT_MS:-1500}
      INVENTORY_STATEMENT_TIMEOUT_MS: ${INVENTORY_STATEMENT_TIMEOUT_MS:-1800}
    depends_on:
      db-inventory:
        condition: service_healthy
    healthcheck:
      # Actuator on the internal management port (never published).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks: [inventory-net]

  db-inventory:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
    volumes:
      - db-inventory-data:/var/lib/postgresql
    healthcheck: *pg-health
    networks: [inventory-net]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-net, inventory-net]

  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URL: /docs/openapi.yaml
      DEEP_LINKING: "true"
      PERSIST_AUTHORIZATION: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/docs/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-net]

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-net]

  # ---------------------------------------------------------------- test --
  db-app-test:
    profiles: [test]
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${DB_TEST_DATABASE:-app_test}
      POSTGRES_USER: ${DB_TEST_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:-app-test-password}
    tmpfs:
      - /var/lib/postgresql
    healthcheck: *pg-health
    networks: [test-net]

  api-test:
    profiles: [test]
    build:
      context: backend/api
      target: test
    environment:
      <<: *api-env
      APP_ENV: testing
      CACHE_STORE: array
      DB_HOST: db-app-test
      DB_DATABASE: ${DB_TEST_DATABASE:-app_test}
      DB_USERNAME: ${DB_TEST_USERNAME:-app}
      DB_PASSWORD: ${DB_TEST_PASSWORD:-app-test-password}
      MAIL_MAILER: array
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      db-app-test:
        condition: service_healthy
    networks: [test-net]

  inventory-test:
    profiles: [test]
    image: eclipse-temurin:25.0.5_8-jdk-noble
    working_dir: /work/backend/inventory
    environment:
      GRADLE_USER_HOME: /gradle
      # Testcontainers starts sibling containers on the host daemon and
      # reaches their mapped ports through the Docker host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/inventory:/work/backend/inventory
      - ./contracts:/work/contracts:ro
      - gradle-cache:/gradle
      - inventory-build:/work/backend/inventory/build
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [test-net]

  web-test:
    profiles: [test]
    build:
      context: frontend
      target: base
    working_dir: /work/frontend
    environment:
      CI: "true"
    volumes:
      - ./frontend:/work/frontend
      - ./contracts:/work/contracts:ro
      - web-node-modules:/work/frontend/node_modules
      - pnpm-store:/pnpm/store
    networks: [test-net]

  e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Shares edge's network namespace: the app is http://localhost, so the
    # Secure refresh cookie behaves exactly as in a real browser.
    network_mode: service:edge
    working_dir: /work/tests/e2e
    environment:
      CI: "true"
      EDGE_URL: ${EDGE_URL:-http://localhost}
      TOXIPROXY_URL: ${TOXIPROXY_URL:-http://toxiproxy:8474}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.test}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_COUNT: ${SEED_CUSTOMER_COUNT:-60}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run verify"]
    volumes:
      - ./tests:/work/tests
      - e2e-node-modules:/work/tests/e2e/node_modules
    depends_on:
      edge:
        condition: service_healthy

  # --------------------------------------------------------------- tools --
  buf:
    profiles: [tools]
    image: bufbuild/buf:1.75.0
    entrypoint: []
    working_dir: /work
    volumes:
      - .:/work
    network_mode: bridge

  redocly:
    profiles: [tools]
    image: redocly/cli:2.72.1
    working_dir: /work
    volumes:
      - .:/work:ro
    network_mode: bridge

  toolbox:
    profiles: [tools]
    build:
      context: infra/toolbox
    working_dir: /work
    volumes:
      - .:/work:ro
    # Diagnostics only (grpcurl, psql): on both networks, not part of the app.
    networks: [app-net, inventory-net]

  k6:
    profiles: [tools]
    image: grafana/k6:2.3.0
    network_mode: service:edge
    environment:
      EDGE_URL: ${EDGE_URL:-http://localhost}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.test}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_COUNT: ${SEED_CUSTOMER_COUNT:-60}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    volumes:
      - ./tests:/work/tests:ro
    depends_on:
      edge:
        condition: service_healthy

networks:
  app-net: {}
  inventory-net:
    internal: true
  test-net: {}

volumes:
  db-app-data: {}
  db-inventory-data: {}
  product-images: {}
  jwt-keys: {}
  gradle-cache: {}
  inventory-build: {}
  web-node-modules: {}
  pnpm-store: {}
  e2e-node-modules: {}
