// =============================================================================
// Inventory Service — gRPC contract (source of truth)
// -----------------------------------------------------------------------------
// Contract-first (ADR-0002): every change goes through
//   buf lint → buf breaking (against main) → make gen → review by both teams.
//
// Semantics binding on both client (Laravel) and server (Spring Boot).
// Full details: docs/03-grpc-contract.md and docs/05-inventory-consistency.md.
//
//  1. ReserveStock is atomic: either every line is reserved or nothing is.
//  2. ReserveStock, ReleaseStock and AdjustStock are idempotent through a
//     caller-generated id (reservation_id / adjustment_id).
//  3. Insufficient stock is a business outcome, not an error: the call returns
//     OK with outcome = RESERVE_OUTCOME_INSUFFICIENT_STOCK. Non-OK gRPC status
//     codes are reserved for failures only.
//  4. ReleaseStock for an unknown id writes a RELEASED "tombstone", so a late
//     ReserveStock with the same id returns
//     RESERVE_OUTCOME_RESERVATION_ALREADY_RELEASED and reserves nothing. This
//     closes the race "client times out → Release overtakes a slow Reserve".
//  5. Every call carries a caller deadline; the server does no work after it.
//  6. Metadata: the caller sends `x-request-id` to correlate logs across both
//     services.
//
// Identifiers: product ids are ULIDs (26 chars, Crockford base32) owned by the
// main application; reservation_id and adjustment_id are UUIDs (RFC 9562,
// canonical lowercase text form) generated by the caller.
// =============================================================================
syntax = "proto3";

package inventory.v1;

option java_multiple_files = true;
option java_outer_classname = "InventoryProto";
option java_package = "com.ecommerce.inventory.grpc.v1";
option php_metadata_namespace = "Ecommerce\\Inventory\\V1\\GPBMetadata";
option php_namespace = "Ecommerce\\Inventory\\V1";

// InventoryService is the only interface to inventory data. The main
// application never reads the inventory database.
service InventoryService {
  // GetStock answers "how many units of these products are left?".
  // Batched to avoid N+1 calls when rendering product lists.
  // A product unknown to the inventory returns available = 0, tracked = false.
  // Errors: INVALID_ARGUMENT (bad ids), DEADLINE_EXCEEDED, CANCELLED, INTERNAL.
  rpc GetStock(GetStockRequest) returns (GetStockResponse);

  // ReserveStock reserves the quantities of every order line in one atomic
  // call (all-or-nothing). Shortage is reported as an outcome, not an error.
  // Errors: INVALID_ARGUMENT, DEADLINE_EXCEEDED, CANCELLED, ABORTED (lock
  // timeout), INTERNAL.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // ReleaseStock returns previously reserved quantities when an order fails
  // or is cancelled. Idempotent; tombstones unknown ids (see rule 4).
  // Errors: INVALID_ARGUMENT, DEADLINE_EXCEEDED, CANCELLED, ABORTED, INTERNAL.
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);

  // AdjustStock is the administrative operation (restock or write-off).
  // Not one of the three operations required by the brief; added because
  // "inventory management" is a mandatory feature and the main application
  // may not touch the inventory database (decision D-01: all inventory
  // management lives in the Spring Boot service). Creates the stock row for a
  // product seen for the first time.
  // Errors: INVALID_ARGUMENT, FAILED_PRECONDITION (result would be negative —
  // an administrative call error, not a business outcome), DEADLINE_EXCEEDED,
  // CANCELLED, ABORTED, INTERNAL.
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
}

// ----------------------------------------------------------------- GetStock --

// GetStockRequest asks for the current level of one or more products.
message GetStockRequest {
  // Product ULIDs. 1..100 entries, no duplicates; otherwise INVALID_ARGUMENT.
  repeated string product_ids = 1;
}

// StockLevel is the current availability of a single product.
message StockLevel {
  // Product ULID, echoed from the request.
  string product_id = 1;
  // Units available for reservation right now (reserved units excluded).
  // Never negative.
  int64 available = 2;
  // False when the product has never been registered in the inventory
  // (no AdjustStock yet); available is then 0.
  bool tracked = 3;
}

// GetStockResponse carries one level per requested product.
message GetStockResponse {
  // Exactly one entry per requested product_id, in the same order.
  repeated StockLevel levels = 1;
}

// ------------------------------------------------------------- ReserveStock --

// ReservationItem is one order line to reserve.
message ReservationItem {
  // Product ULID.
  string product_id = 1;
  // Units to reserve, 1..1000. Duplicate lines for the same product are
  // rejected with INVALID_ARGUMENT (the caller must merge them).
  int32 quantity = 2;
}

// ReserveStockRequest reserves every line of one order attempt.
message ReserveStockRequest {
  // UUID generated by the caller for each order-creation attempt. Idempotency
  // key: repeating the call with the same id never reserves twice. A repeat
  // is answered from the stored reservation; its items are not compared, so
  // the caller must never reuse an id for different items.
  string reservation_id = 1;
  // Lines to reserve, 1..100 entries.
  repeated ReservationItem items = 2;
}

// ReserveOutcome is the business result of a ReserveStock call.
enum ReserveOutcome {
  // Never sent by the server; a client receiving it treats the response as a
  // contract violation.
  RESERVE_OUTCOME_UNSPECIFIED = 0;
  // Every line was reserved (or the reservation already existed with the
  // same id — a safe retry).
  RESERVE_OUTCOME_RESERVED = 1;
  // At least one line has insufficient stock. Nothing was reserved; details
  // are in shortages.
  RESERVE_OUTCOME_INSUFFICIENT_STOCK = 2;
  // The id was already released (tombstone). Nothing was reserved.
  RESERVE_OUTCOME_RESERVATION_ALREADY_RELEASED = 3;
}

// Shortage describes one line that could not be satisfied.
message Shortage {
  // Product ULID of the short line.
  string product_id = 1;
  // Units requested for this product.
  int32 requested = 2;
  // Units available at the time of the attempt (0 for untracked products).
  int64 available = 3;
}

// ReserveStockResponse reports the outcome of a reservation attempt.
message ReserveStockResponse {
  // Echo of the request reservation_id; the client verifies it matches.
  string reservation_id = 1;
  // Business outcome; never RESERVE_OUTCOME_UNSPECIFIED.
  ReserveOutcome outcome = 2;
  // Non-empty only when outcome = RESERVE_OUTCOME_INSUFFICIENT_STOCK. Lists
  // every short line (not just the first), ordered by product_id.
  repeated Shortage shortages = 3;
}

// ------------------------------------------------------------- ReleaseStock --

// ReleaseReason records why a reservation is released (audit only; it does
// not change behaviour).
enum ReleaseReason {
  // Rejected with INVALID_ARGUMENT; the caller must state a reason.
  RELEASE_REASON_UNSPECIFIED = 0;
  // Saving the order failed after the reservation succeeded.
  RELEASE_REASON_ORDER_PERSISTENCE_FAILED = 1;
  // The ReserveStock outcome is unknown (timeout/unavailable) → precautionary
  // compensation.
  RELEASE_REASON_RESERVE_OUTCOME_UNKNOWN = 2;
  // An admin cancelled the order.
  RELEASE_REASON_ORDER_CANCELLED = 3;
  // The reconciler found an orphaned reservation.
  RELEASE_REASON_RECONCILIATION = 4;
}

// ReleaseStockRequest asks to return the quantities of one reservation.
message ReleaseStockRequest {
  // UUID of the reservation to release (the id sent to ReserveStock).
  string reservation_id = 1;
  // Why the reservation is released; must not be RELEASE_REASON_UNSPECIFIED.
  ReleaseReason reason = 2;
}

// ReleaseOutcome is the result of a ReleaseStock call.
enum ReleaseOutcome {
  // Never sent by the server; treated by the client as a contract violation.
  RELEASE_OUTCOME_UNSPECIFIED = 0;
  // The reservation was active and its quantities were returned now.
  RELEASE_OUTCOME_RELEASED = 1;
  // The reservation was already released — nothing changed (idempotent).
  RELEASE_OUTCOME_ALREADY_RELEASED = 2;
  // The id did not exist; a tombstone was written to block any late
  // ReserveStock with the same id.
  RELEASE_OUTCOME_NOT_FOUND_TOMBSTONED = 3;
}

// ReleaseStockResponse reports the outcome of a release.
message ReleaseStockResponse {
  // Echo of the request reservation_id; the client verifies it matches.
  string reservation_id = 1;
  // Result of the release; never RELEASE_OUTCOME_UNSPECIFIED.
  ReleaseOutcome outcome = 2;
}

// -------------------------------------------------------------- AdjustStock --

// AdjustStockRequest changes the available quantity of one product.
message AdjustStockRequest {
  // UUID generated by the caller for each adjustment (idempotency key):
  // repeating the call with the same id applies the delta only once. The
  // repeated payload is not compared; payload consistency is the caller's job
  // (Laravel derives the id from the HTTP Idempotency-Key).
  string adjustment_id = 1;
  // Product ULID. An unknown product gets a stock row; a negative delta on it
  // fails with FAILED_PRECONDITION and nothing is created.
  string product_id = 2;
  // Positive = restock, negative = write-off (damage, stock count). Must not
  // be zero; |delta| <= 1,000,000. A delta that would make the available
  // quantity negative fails with FAILED_PRECONDITION.
  int64 delta = 3;
  // Short free-text note for the audit trail, at most 200 characters. May be
  // empty.
  string note = 4;
}

// AdjustStockResponse reports the level after the adjustment.
message AdjustStockResponse {
  // Echo of the request adjustment_id.
  string adjustment_id = 1;
  // Echo of the request product_id.
  string product_id = 2;
  // Units available after the adjustment (for a repeated adjustment_id: the
  // current level, the delta is not applied again).
  int64 available = 3;
}
