; Overrides for the official image's [www] pool (loaded last, zz-*).
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; The master runs as www-data (USER in the Dockerfile); user/group are ignored.
pm = dynamic
; Configurable worker count (default 16 from the Dockerfile ENV) so the race
; test is truly concurrent at the inventory service.
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; Liveness endpoint for the container healthcheck (only reachable over the
; FastCGI socket: edge forwards every /api request to /app/public/index.php).
ping.path = /fpm-ping
ping.response = pong

; Keep the environment from compose (DB_*, JWT_*, INVENTORY_*).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
