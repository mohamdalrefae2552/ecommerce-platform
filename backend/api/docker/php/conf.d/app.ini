; Application PHP settings (all environments). Loaded after php.ini-production.
expose_php = Off
memory_limit = 256M
max_execution_time = 30
; Product images are at most 3 MB (edge client_max_body_size 3m, docs/02).
upload_max_filesize = 3M
post_max_size = 4M
max_file_uploads = 1
date.timezone = UTC
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.exception_ignore_args = On
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
