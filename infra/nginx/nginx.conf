worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never advertise the nginx version (docs/04 section 4).
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Hard ceiling for any request body (images are <= 2 MB, checked by Laravel).
    client_max_body_size 3m;

    # read_only root filesystem: temp files go to tmpfs mounts.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # X-Request-Id: keep the client's value when it is a sane token, otherwise
    # use nginx's own random id. Forwarded to Laravel, echoed in the response.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
        default                    $request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
