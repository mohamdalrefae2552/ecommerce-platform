# Single origin for the SPA, the API, the API docs and product images
# (docs/01 section 1): no CORS, and the refresh cookie works with
# SameSite=Strict.
server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS; short TTL so a restarted container's new IP is
    # picked up without restarting edge.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api:9000;
    set $swagger_upstream http://swagger:8080;
    set $reverb_upstream http://reverb:8080;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------- API --
    location = /api {
        include snippets/problem-404.conf;
    }

    location ^~ /api/ {
        # Security headers for API responses are set by Laravel
        # (SecurityHeaders middleware); edge only adds them on its own errors.
        error_page 413 @problem_413;
        error_page 502 @problem_502;
        error_page 503 @problem_503;
        error_page 504 @problem_504;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /app/public;
        fastcgi_param HTTPS           $https if_not_empty;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        # FastCGI has no proxy hop: REMOTE_ADDR is already the real client.
        # Client-supplied forwarding headers are dropped so they can never be
        # used to spoof the IP used by the rate limiters.
        fastcgi_param HTTP_X_FORWARDED_FOR   "";
        fastcgi_param HTTP_X_FORWARDED_HOST  "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT  "";
        fastcgi_param HTTP_X_REAL_IP         "";
        fastcgi_param HTTP_FORWARDED         "";

        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 30s;
        fastcgi_pass $php_upstream;
    }

    # ------------------------------------------------------- WebSocket --
    # Requirement 4: browsers open ws://<origin>/app/<key> (Pusher protocol);
    # edge upgrades the connection and forwards it to Reverb. The publishing
    # API of Reverb (/apps/...) is NOT proxied: only the workers reach it.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_connect_timeout 5s;
        # Reverb pings every 60 s; an idle socket outlives that.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass $reverb_upstream;
    }

    # problem+json for errors produced by edge itself: never HTML on /api.
    location @problem_413 {
        include snippets/problem-headers.conf;
        return 413 '{"type":"https://ecommerce.local/problems/payload-too-large","title":"Payload too large","status":413,"detail":"حجم الطلب أكبر من المسموح (3 ميغابايت).","instance":"$uri","code":"PAYLOAD_TOO_LARGE","trace_id":"$req_id"}';
    }
    location @problem_502 {
        include snippets/problem-headers.conf;
        return 502 '{"type":"https://ecommerce.local/problems/internal-error","title":"Bad gateway","status":502,"detail":"الخادم غير متاح حالياً، حاول بعد قليل.","instance":"$uri","code":"INTERNAL_ERROR","trace_id":"$req_id"}';
    }
    location @problem_503 {
        include snippets/problem-headers.conf;
        return 503 '{"type":"https://ecommerce.local/problems/internal-error","title":"Service unavailable","status":503,"detail":"الخادم غير متاح حالياً، حاول بعد قليل.","instance":"$uri","code":"INTERNAL_ERROR","trace_id":"$req_id"}';
    }
    location @problem_504 {
        include snippets/problem-headers.conf;
        return 504 '{"type":"https://ecommerce.local/problems/internal-error","title":"Gateway timeout","status":504,"detail":"استغرق الخادم وقتاً أطول من المسموح.","instance":"$uri","code":"INTERNAL_ERROR","trace_id":"$req_id"}';
    }

    # ---------------------------------------------------- product images --
    # Only re-encoded WebP files named by ULID are served (docs/02 Products).
    location ~ "^/storage/products/([0-9A-HJKMNP-TV-Z]{26})\.webp$" {
        alias /srv/storage/products/$1.webp;
        types { }
        default_type image/webp;
        include snippets/static-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Plain prefix (not ^~): a ^~ prefix would win over the image regex above.
    location /storage/ {
        return 404;
    }

    # ------------------------------------------------------------ docs --
    location = /docs {
        return 301 /docs/;
    }
    location = /docs/openapi.yaml {
        alias /srv/docs/openapi.yaml;
        types { }
        default_type application/yaml;
        include snippets/docs-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /docs/ {
        proxy_pass $swagger_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        include snippets/docs-headers.conf;
    }

    # ------------------------------------------------------------- SPA --
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        include snippets/spa-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        root /usr/share/nginx/html;
        # Client-side routes (/orders/123) fall back to the SPA shell.
        try_files $uri /index.html;
        include snippets/spa-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
