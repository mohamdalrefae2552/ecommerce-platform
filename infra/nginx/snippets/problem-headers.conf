# Same headers Laravel puts on API responses, for problems edge answers itself.
default_type application/problem+json;
include snippets/common-headers.conf;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
add_header Cache-Control "no-store" always;
