# pg_hba.conf of db-app (requirement 3, read replica). Same rules as the
# image's default file, plus streaming replication from the app network
# (only roles with the REPLICATION attribute can use it: the replicator
# role created by db-app-roles). Loaded with `-c hba_file=...`, so it also
# applies to a data volume initialised before the replica existed.
# TYPE  DATABASE     USER  ADDRESS        METHOD
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
host    replication  all   all            scram-sha-256
host    all          all   all            scram-sha-256
